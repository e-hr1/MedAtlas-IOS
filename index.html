
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d20">

  <title>MedAtlas | موسوعة الأجهزة الطبية</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Vercel -->
  <base href="/">

  <!-- Android Redirect Only -->
  <script>
    (function () {
      const ua = navigator.userAgent || navigator.vendor || "";

      const androidLink =
        "https://play.google.com/store/apps/details?id=com.my.ElectroPro2024";

      if (/Android/i.test(ua)) {
        window.location.replace(androidLink);
      }
    })();
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080d20;
      color: white;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 20% 20%, #243d75 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, #35266d 0%, transparent 45%),
        linear-gradient(135deg, #080d20, #111a35);

      transition: opacity .7s ease, visibility .7s ease;
    }

    .glass-card {
      width: min(88%, 390px);
      padding: 42px 25px;
      text-align: center;

      border: 1px solid rgba(255,255,255,.16);
      border-radius: 30px;

      background: rgba(255,255,255,.08);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow: 0 20px 70px rgba(0,0,0,.35);

      animation: appear 1s ease;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 25px;
      margin-bottom: 20px;

      filter: drop-shadow(0 0 20px rgba(90,121,248,.4));

      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 14px;
      color: #c5d0ed;
      line-height: 1.9;
      margin-bottom: 30px;
    }

    .loader {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,.12);
      border-radius: 20px;
      overflow: hidden;
    }

    .loader span {
      display: block;
      width: 35%;
      height: 100%;
      border-radius: 20px;

      background: linear-gradient(90deg, #5a79f8, #9b8cff);

      animation: loading 2s ease-in-out infinite;
    }

    .loading-text {
      margin-top: 15px;
      font-size: 12px;
      color: #aab8df;
    }

    @keyframes loading {
      0% {
        transform: translateX(250%);
      }

      100% {
        transform: translateX(-350%);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #loading-screen.hide {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>

<body>

  <!-- Liquid Glass Loading Screen -->
  <div id="loading-screen">

    <div class="glass-card">

      <img
        src="favicon.png"
        alt="MedAtlas Logo"
        class="logo"
      >

      <h1>MedAtlas</h1>

      <p class="subtitle">
        موسوعة الأجهزة الطبية الشاملة
        <br>
        تعلّم، اكتشف، ووسّع معرفتك الطبية
      </p>

      <div class="loader">
        <span></span>
      </div>

      <p class="loading-text">
        جاري تجهيز التطبيق...
      </p>

    </div>

  </div>

  <!-- Flutter Application -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Hide Loading Screen After Flutter First Frame -->
  <script>
    window.addEventListener("flutter-first-frame", function () {

      const screen = document.getElementById("loading-screen");

      if (screen) {

        screen.classList.add("hide");

        setTimeout(function () {
          screen.remove();
          document.body.style.overflow = "auto";
        }, 750);

      }

    });
  </script>

</body>
</html>
